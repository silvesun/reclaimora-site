name: Problem report
description: Report an issue with Reclaimora
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Issues are public. Do not upload private files, account details, full file paths, or unredacted screenshots."
  - type: input
    id: app_version
    attributes:
      label: Reclaimora version and build
      placeholder: "For example: 1.0 (2)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Mac App Store
        - Direct distribution
        - Development build
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected page, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permission state and redacted errors
      description: Describe access without revealing personal folder paths.
