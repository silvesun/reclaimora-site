name: Suggestion
description: Suggest an improvement
title: "[Suggestion] "
body:
  - type: markdown
    attributes:
      value: "This is a public discussion. Please keep personal information out of your report."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your use case and the difficulty you encountered.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
