<h1>支持</h1><p>遇到问题或有疑问？请<a href="https://github.com/silvesun/reclaimora-site/issues">在 GitHub 上提交 issue</a>，并注明 macOS 版本和操作经过。</p>
<section class="card"><h2>误删了内容</h2><p>所有内容都会进入废纸篓。可在 Reclaimora 的清理记录中恢复，或直接从废纸篓拖出。移除的照片在“照片”的“最近删除”中。</p></section>
<section class="card"><h2>某个文件夹没有被扫描</h2><p>Reclaimora 只读取你选择的文件夹。请在 Reclaimora 中重新选择该文件夹；邮件附件需要在系统设置 › 隐私与安全性中授予完全磁盘访问权限。</p></section>
<section class="card"><h2>收不到提醒</h2><p>请在系统设置 › 通知中允许 Reclaimora 发送通知。</p></section>
